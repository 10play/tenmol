name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

jobs:
  # ── Auto-review every PR ──────────────────────────────────────────────────
  auto-review:
    name: Auto Review PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR metadata
        id: meta
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            fs.writeFileSync('/tmp/pr-title.txt', context.payload.pull_request.title);
            core.setOutput('number', context.issue.number);
            core.setOutput('base', context.payload.pull_request.base.ref);

      - name: Get PR diff
        run: |
          git fetch origin ${{ steps.meta.outputs.base }}
          git diff origin/${{ steps.meta.outputs.base }}...HEAD \
            -- ':!package-lock.json' ':!yarn.lock' ':!bun.lockb' \
               ':!*.min.js' ':!*.min.css' ':!pnpm-lock.yaml' \
            | head -c 60000 > /tmp/pr-diff.txt
          echo "Diff: $(wc -c < /tmp/pr-diff.txt) bytes"

      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run Claude review
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_SETUP_TOKEN }}
        run: |
          python3 - << 'PYEOF'
          import subprocess, sys

          pr_title = open('/tmp/pr-title.txt').read().strip()
          diff = open('/tmp/pr-diff.txt').read().strip() or '(empty diff)'

          prompt = (
              "You are reviewing a pull request for the tenmol repo — "
              "a React Native / TypeScript frontend with a Python + PyMOL WebSocket backend.\n\n"
              f"PR: {pr_title}\n\nDiff:\n{diff}\n\n"
              "Produce a structured review:\n\n"
              "## Summary\nOne paragraph describing what the PR does.\n\n"
              "## Issues\n"
              "- 🔴 Critical (bugs, security, data loss)\n"
              "- 🟡 Major (logic errors, missing error handling, performance)\n"
              "- 🔵 Minor (style, naming, small improvements)\n"
              "Omit any category with no issues.\n\n"
              "## Suggestions\nOptional improvements (not blocking).\n\n"
              "## Verdict\n"
              "One of: ✅ LGTM | ⚠️ Minor issues — merge after addressing | 🔴 Needs changes\n\n"
              "Be concise and actionable."
          )

          result = subprocess.run(
              ['claude', '-p', prompt],
              capture_output=True, text=True, timeout=300
          )
          output = (result.stdout or result.stderr or '(no output)').strip()
          open('/tmp/review-output.txt', 'w').write(output)
          print(f"Claude returned {len(output)} chars")
          PYEOF

      - name: Post review comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const review = fs.readFileSync('/tmp/review-output.txt', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🤖 **Claude Code Review**\n\n${review}\n\n---\n_Comment \`@claude <question>\` to ask a follow-up._`
            });

  # ── Respond to @claude comments ──────────────────────────────────────────
  respond-to-claude:
    name: Respond to @claude
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Get PR info + comments
        id: info
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            fs.writeFileSync('/tmp/user-comment.txt', context.payload.comment.body);

            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            fs.writeFileSync('/tmp/pr-title.txt', pr.data.title);
            core.setOutput('base', pr.data.base.ref);
            core.setOutput('head', pr.data.head.ref);

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 10
            });
            const log = comments.data.slice(-10)
              .map(c => `[${c.user.login}]: ${c.body}`)
              .join('\n\n---\n\n');
            fs.writeFileSync('/tmp/comments.txt', log);

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        run: |
          git fetch origin ${{ steps.info.outputs.base }} ${{ steps.info.outputs.head }}
          git diff origin/${{ steps.info.outputs.base }}...origin/${{ steps.info.outputs.head }} \
            -- ':!package-lock.json' ':!yarn.lock' ':!bun.lockb' \
               ':!*.min.js' ':!*.min.css' ':!pnpm-lock.yaml' \
            | head -c 40000 > /tmp/pr-diff.txt

      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run Claude response
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_SETUP_TOKEN }}
        run: |
          python3 - << 'PYEOF'
          import subprocess, sys

          pr_title  = open('/tmp/pr-title.txt').read().strip()
          raw       = open('/tmp/user-comment.txt').read()
          question  = raw.replace('@claude', '').strip()
          diff      = open('/tmp/pr-diff.txt').read().strip() or '(empty diff)'
          comments  = open('/tmp/comments.txt').read().strip()

          prompt = (
              "You are a code review assistant for the tenmol repo "
              "(React Native + TypeScript, Python/PyMOL WebSocket backend).\n\n"
              f"PR: {pr_title}\n\nDiff (truncated):\n{diff}\n\n"
              f"Recent PR comments:\n{comments}\n\n"
              f"Question: {question}\n\n"
              "Answer concisely and helpfully. Reference specific code when relevant."
          )

          result = subprocess.run(
              ['claude', '-p', prompt],
              capture_output=True, text=True, timeout=300
          )
          output = (result.stdout or result.stderr or '(no output)').strip()
          open('/tmp/response-output.txt', 'w').write(output)
          sys.exit(0)
          PYEOF

      - name: Post response
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const response = fs.readFileSync('/tmp/response-output.txt', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🤖 **Claude:** ${response}`
            });
