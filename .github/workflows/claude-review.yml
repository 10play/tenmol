name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

jobs:
  auto-review:
    name: Auto Review PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        id: diff
        run: |
          git fetch origin ${{ github.base_ref }}
          DIFF=$(git diff origin/${{ github.base_ref }}...HEAD \
            -- ':!package-lock.json' ':!yarn.lock' ':!bun.lockb' ':!*.min.js' ':!*.min.css' \
            | head -c 60000)
          {
            echo 'DIFF<<DIFF_EOF'
            echo "$DIFF"
            echo 'DIFF_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Write review prompt
        run: |
          cat > /tmp/review-prompt.txt << 'PROMPT_EOF'
You are reviewing a pull request for the tenmol repo — a React Native app with a Python/WebSocket backend.

Review the diff below. Produce a structured review with these sections:

## Summary
One paragraph describing what the PR does.

## Issues
List any problems found, grouped:
- 🔴 Critical (bugs, security issues, data loss risk)
- 🟡 Major (logic errors, missing error handling, performance)
- 🔵 Minor (style, naming, small improvements)

If none in a category, omit it.

## Suggestions
Optional improvements (not blocking).

## Verdict
One of:
- ✅ LGTM — ready to merge
- ⚠️ Minor issues — can merge after addressing
- 🔴 Needs changes — must fix before merging

Keep it concise and actionable. If the diff is empty or trivial, say so.
PROMPT_EOF

      - name: Run Claude review
        env:
          CLAUDE_SETUP_TOKEN: ${{ secrets.CLAUDE_SETUP_TOKEN }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          PR_TITLE="${{ github.event.pull_request.title }}"
          DIFF="${{ steps.diff.outputs.DIFF }}"

          FULL_PROMPT="$(cat /tmp/review-prompt.txt)

PR: #${PR_NUMBER} — ${PR_TITLE}

Diff:
${DIFF}"

          echo "$FULL_PROMPT" | claude -p > /tmp/review-output.txt 2>&1
          echo "Review output:"
          cat /tmp/review-output.txt

      - name: Post review comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const review = fs.readFileSync('/tmp/review-output.txt', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🤖 Claude Code Review\n\n${review}\n\n---\n_Tip: Comment \`@claude <question>\` to ask follow-up questions._`
            });

  respond-to-comment:
    name: Respond to @claude comment
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR info
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput('base_ref', pr.data.base.ref);
            core.setOutput('head_ref', pr.data.head.ref);
            core.setOutput('title', pr.data.title);

      - name: Checkout PR branch
        run: |
          git fetch origin ${{ steps.pr.outputs.head_ref }}
          git checkout ${{ steps.pr.outputs.head_ref }}

      - name: Get PR diff
        run: |
          git fetch origin ${{ steps.pr.outputs.base_ref }}
          git diff origin/${{ steps.pr.outputs.base_ref }}...HEAD \
            -- ':!package-lock.json' ':!yarn.lock' ':!bun.lockb' ':!*.min.js' ':!*.min.css' \
            | head -c 40000 > /tmp/pr-diff.txt

      - name: Get recent comments
        uses: actions/github-script@v7
        with:
          script: |
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 10
            });
            const fs = require('fs');
            const commentLog = comments.data.slice(-10).map(c =>
              `[${c.user.login}]: ${c.body}`
            ).join('\n\n---\n\n');
            fs.writeFileSync('/tmp/comments.txt', commentLog);

      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Write response prompt
        run: |
          USER_COMMENT="${{ github.event.comment.body }}"
          QUESTION="${USER_COMMENT//@claude/}"
          PR_TITLE="${{ steps.pr.outputs.title }}"
          DIFF=$(cat /tmp/pr-diff.txt)
          COMMENTS=$(cat /tmp/comments.txt)

          cat > /tmp/respond-prompt.txt << PROMPT_EOF
You are a code review assistant for the tenmol repo — a React Native app with a Python/WebSocket backend.

A team member asked you a question about PR #${{ context.issue.number }} — ${PR_TITLE}.

PR Diff (truncated):
${DIFF}

Recent PR comments for context:
${COMMENTS}

Their question: ${QUESTION}

Answer concisely and helpfully. Reference specific lines or code when relevant.
PROMPT_EOF

      - name: Run Claude response
        env:
          CLAUDE_SETUP_TOKEN: ${{ secrets.CLAUDE_SETUP_TOKEN }}
        run: |
          claude -p "$(cat /tmp/respond-prompt.txt)" > /tmp/response-output.txt 2>&1
          echo "Response output:"
          cat /tmp/response-output.txt

      - name: Post response comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const response = fs.readFileSync('/tmp/response-output.txt', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🤖 **Claude:** ${response}`
            });
