name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Claude Code Review
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '@claude review'))

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR info
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            PR_NUMBER="${{ github.event.issue.number }}"
          else
            PR_NUMBER="${{ github.event.pull_request.number }}"
          fi
          echo "number=$PR_NUMBER" >> $GITHUB_OUTPUT
          SHA=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json headRefOid -q .headRefOid)
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          BASE=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json baseRefName -q .baseRefName)
          echo "base=$BASE" >> $GITHUB_OUTPUT

      - name: Generate diff
        run: |
          git fetch origin ${{ steps.pr.outputs.base }}
          git diff origin/${{ steps.pr.outputs.base }}...${{ steps.pr.outputs.sha }} \
            -- ':!*.lock' ':!*.min.js' ':!*.min.css' ':!dist/*' ':!build/*' \
            | head -c 60000 > /tmp/pr.diff
          echo "Diff size: $(wc -c < /tmp/pr.diff) bytes"

      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run Claude review
        env:
          CLAUDE_SETUP_TOKEN: ${{ secrets.CLAUDE_SETUP_TOKEN }}
        run: |
          DIFF=$(cat /tmp/pr.diff)

          claude -p "You are an expert code reviewer for the tenmol project: a PyMOL web client \
consisting of a React/TypeScript viewport (apps/web/) and a Python WebSocket bridge \
(packages/bridge/) that drives PyMOL over a JSON protocol.

Review the following pull request diff concisely. Structure your review as:

## Summary
One paragraph: what the PR does.

## Issues
List any bugs, correctness problems, security concerns, or API misuses.
Use sub-headings (### Critical / ### Major / ### Minor) only when there are issues in that category. If none, say 'No issues found.'

## Suggestions
Optional improvements: code quality, performance, maintainability.
Keep this brief — don't nitpick style already handled by the formatter.

## Verdict
One of: ✅ **LGTM** | ⚠️ **Needs minor changes** | 🔴 **Needs changes**

Here is the diff to review:

\`\`\`diff
${DIFF}
\`\`\`" \
            --output-format text > /tmp/claude-review.md

          echo "Claude review complete."

      - name: Post review comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REVIEW=$(cat /tmp/claude-review.md)
          SHA="${{ steps.pr.outputs.sha }}"
          SHORT_SHA="${SHA:0:7}"

          BODY="<!-- claude-review -->
## 🤖 Claude Code Review (${SHORT_SHA})

${REVIEW}

---
<sub>Triggered by \${{ github.event_name }} · [workflow run](\${{ github.server_url }}/\${{ github.repository }}/actions/runs/\${{ github.run_id }})</sub>"

          gh pr comment "${{ steps.pr.outputs.number }}" \
            --repo "${{ github.repository }}" \
            --body "$BODY"
