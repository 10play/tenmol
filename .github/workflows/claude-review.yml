name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  claude-review:
    name: claude-review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Review
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read CLAUDE.md first — it holds the
            repository's conventions, and a change that violates them is a
            finding.

            Classify every finding as exactly one of:

            **blocking** — the PR must not merge as-is:
              - Correctness bugs, unhandled errors, race conditions
              - Security issues: injection, secret leakage, unsafe input handling
              - Type unsoundness: `any`, non-null `!` assertions, or `@ts-ignore`
                used to silence a real error
              - A new or changed export that is not documented in an `.mdx` page
                under `apps/docs`, or a docs page that was not added to
                `navigation` in `apps/docs/docs.json`
              - Docs that contradict the code they describe
              - A new package with no `typecheck` script or no `tsconfig.json`
                extending `tsconfig.base.json`
              - Dependency placement that breaks the workspace rules in
                CLAUDE.md (runtime deps at the root, missing `workspace:`
                protocol, npm/yarn lockfiles)

            **suggestion** — worth saying, must not block: naming, style,
            structure preferences, optional refactors, praise.

            Be strict about the documentation rule: this repository requires
            that every exported symbol is documented in Mintlify. Be
            conservative about everything else — do not invent problems, and do
            not report a finding you have not verified by reading the code. If
            the PR is clean, return an empty `findings` array.

            Leave inline comments for specific issues and prefix each one with
            its severity. Then return the structured summary.

            Budget your turns: returning the structured summary is the one
            mandatory step. On a large diff, review breadth-first, stop
            commenting before you run low on turns, and always end by
            returning the structured summary with everything found so far.
          claude_args: |
            --max-turns 100
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)"
            --json-schema '{"type":"object","additionalProperties":false,"required":["summary","findings"],"properties":{"summary":{"type":"string","description":"One-paragraph verdict on the PR"},"findings":{"type":"array","description":"Every issue found; empty if the PR is clean","items":{"type":"object","additionalProperties":false,"required":["severity","file","description"],"properties":{"severity":{"type":"string","enum":["blocking","suggestion"]},"file":{"type":"string"},"description":{"type":"string"}}}}}}'

      - name: Enforce review verdict
        env:
          VERDICT: ${{ steps.review.outputs.structured_output }}
        run: |
          if [ -z "$VERDICT" ]; then
            echo "::error::The review did not produce a structured verdict, so the PR could not be assessed."
            exit 1
          fi

          echo "$VERDICT" | jq -r '.summary'
          echo

          # Newlines must be %0A-escaped or GitHub truncates the annotation.
          echo "$VERDICT" | jq -r '
            .findings[]
            | "::\(if .severity == "blocking" then "error" else "notice" end) file=\(.file)::[\(.severity)] \(.description | gsub("\n"; "%0A"))"
          '

          blocking=$(echo "$VERDICT" | jq '[.findings[] | select(.severity == "blocking")] | length')

          {
            echo "## Claude code review"
            echo
            echo "$VERDICT" | jq -r '.summary'
            echo
            echo "| Severity | File | Finding |"
            echo "| --- | --- | --- |"
            echo "$VERDICT" | jq -r '.findings[] | "| \(.severity) | `\(.file)` | \(.description | gsub("\n"; " ")) |"'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$blocking" -gt 0 ]; then
            echo "::error::$blocking blocking issue(s) found — see the review comments."
            exit 1
          fi

          echo "No blocking issues."
