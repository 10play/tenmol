name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

jobs:
  auto-review:
    name: Auto Review PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        id: diff
        run: |
          git fetch origin ${{ github.base_ref }}
          DIFF=$(git diff origin/${{ github.base_ref }}...HEAD -- \
            ':!package-lock.json' ':!yarn.lock' ':!bun.lockb' ':!*.min.js' ':!*.min.css' \
            | head -c 60000)
          echo "diff<<DIFF_EOF" >> $GITHUB_OUTPUT
          echo "$DIFF" >> $GITHUB_OUTPUT
          echo "DIFF_EOF" >> $GITHUB_OUTPUT

      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run Claude review
        id: review
        env:
          CLAUDE_SETUP_TOKEN: ${{ secrets.CLAUDE_SETUP_TOKEN }}
        run: |
          PROMPT="You are reviewing a pull request for the tenmol repo — a React Native app with a Python/WebSocket backend.

          PR: #${{ github.event.pull_request.number }} — ${{ github.event.pull_request.title }}

          Diff:
          ${{ steps.diff.outputs.diff }}

          Write a structured code review with these sections:
          ## Summary
          One paragraph overview of the changes.

          ## Issues
          List any Critical, Major, or Minor issues found. Be specific — include file + line references.

          ## Suggestions
          Optional improvements or nits.

          ## Verdict
          End with one of:
          - ✅ LGTM
          - ⚠️ Minor issues (can merge after addressing)
          - 🔴 Needs changes before merging"

          REVIEW=$(claude -p "$PROMPT" 2>&1)
          echo "review<<REVIEW_EOF" >> $GITHUB_OUTPUT
          echo "$REVIEW" >> $GITHUB_OUTPUT
          echo "REVIEW_EOF" >> $GITHUB_OUTPUT

      - name: Post review comment
        uses: actions/github-script@v7
        with:
          script: |
            const review = `${{ steps.review.outputs.review }}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `<!-- claude-review -->\n🤖 **Claude Code Review**\n\n${review}\n\n---\n_Reply with \`@claude <question>\` to follow up._`
            });

  respond-to-comment:
    name: Respond to @claude mention
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff for context
        id: diff
        run: |
          PR_NUMBER=${{ github.event.issue.number }}
          PR_DATA=$(gh api repos/${{ github.repository }}/pulls/$PR_NUMBER)
          BASE=$(echo "$PR_DATA" | jq -r '.base.ref')
          HEAD=$(echo "$PR_DATA" | jq -r '.head.sha')
          git fetch origin $BASE
          git fetch origin $HEAD
          DIFF=$(git diff origin/$BASE...$HEAD -- \
            ':!package-lock.json' ':!yarn.lock' ':!bun.lockb' \
            | head -c 30000)
          echo "diff<<DIFF_EOF" >> $GITHUB_OUTPUT
          echo "$DIFF" >> $GITHUB_OUTPUT
          echo "DIFF_EOF" >> $GITHUB_OUTPUT
          echo "base=$BASE" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get recent comment thread for context
        id: context
        uses: actions/github-script@v7
        with:
          script: |
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 20
            });
            const thread = comments.data
              .slice(-10)
              .map(c => `**${c.user.login}:** ${c.body}`)
              .join('\n\n---\n\n');
            core.setOutput('thread', thread);

      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run Claude response
        id: response
        env:
          CLAUDE_SETUP_TOKEN: ${{ secrets.CLAUDE_SETUP_TOKEN }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENTER: ${{ github.event.comment.user.login }}
        run: |
          # Strip @claude prefix from the question
          QUESTION=$(echo "$COMMENT_BODY" | sed 's/@claude//g' | xargs)

          PROMPT="You are a code review assistant for tenmol — a React Native app with a Python/WebSocket backend.

          You are responding to a comment on PR #${{ github.event.issue.number }}: ${{ github.event.issue.title }}

          Recent comment thread:
          ${{ steps.context.outputs.thread }}

          PR diff for context:
          ${{ steps.diff.outputs.diff }}

          $COMMENTER asks: $QUESTION

          Answer directly and helpfully. Be concise. Reference specific code from the diff where relevant."

          RESPONSE=$(claude -p "$PROMPT" 2>&1)
          echo "response<<RESPONSE_EOF" >> $GITHUB_OUTPUT
          echo "$RESPONSE" >> $GITHUB_OUTPUT
          echo "RESPONSE_EOF" >> $GITHUB_OUTPUT

      - name: Post response
        uses: actions/github-script@v7
        with:
          script: |
            const response = `${{ steps.response.outputs.response }}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🤖 **Claude:** ${response}`
            });
