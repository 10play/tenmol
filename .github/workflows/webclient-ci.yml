# Web client CI.
#
# Separate from .github/workflows/build.yml, which is upstream PyMOL's own CI.
# This one runs the gates the web-client half of the repo depends on: the JS
# suite plus the three repo linters on Linux, and the real thing -- PyMOL built
# from packages/engine/ plus the bridge's pytest suite -- on macOS.
#
# PATHS. Everything below is the post-monorepo layout:
#   apps/web/          React app         packages/engine/   upstream PyMOL
#   packages/bridge/   Python bridge     packages/{protocol,client,stores,viewport}
#   scripts/  tools/  docs/
#
# NO paths-ignore. Skipping CI for docs-only pushes is tempting, but two of the
# gates below PARSE docs/: scripts/parity.mjs reads docs/feature-parity.md
# and scripts/ownership.mjs reads docs/code-ownership.md. A docs-only
# commit can break CI, so a docs-only commit has to run CI.
#
# macOS is the primary platform: offscreen GL is CGL there and it is the only
# platform the viewport is verified on. GitHub's macOS runners have no
# logged-in window server, so hardware CGL context creation can fail -- the two
# GL-dependent steps are therefore reported but not fatal, exactly like the ray
# image-diff suites. Everything that does NOT need GL is a hard gate.
#
# e2e is deliberately absent: it lives in its own workflow.
name: webclient-ci

on:
  push:
    branches: [master, web-client, "wp-*"]
  pull_request:
  workflow_dispatch:

# `github.event_name` is in the key on purpose: without it the push run
# and the pull_request run for the same branch share a group and cancel
# each other, which is why runs showed up as `cancelled` with no cause.
concurrency:
  group: webclient-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.13"
  # Bump to invalidate the built-engine cache by hand (a Homebrew or Xcode
  # change that the source hash cannot see).
  CACHE_EPOCH: v1

jobs:
  # -------------------------------------------------------------------------
  # Fast gates that need no PyMOL build.
  #
  # Every step here is a gate. Nothing in this job merely reports: a linter
  # whose failure is ignored is decoration.
  # -------------------------------------------------------------------------
  static:
    name: lint / typecheck / build / unit / linters
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          # scripts/ownership.mjs --base needs a merge-base with the target
          # branch, and the default shallow checkout has neither the base ref
          # nor common history. fetch-depth: 0 makes actions/checkout use the
          # all-branches refspec.
          fetch-depth: 0

      # No `version:` input: package.json's "packageManager" field is the
      # single source of truth and pnpm/action-setup@v4 reads it. Two pinned
      # versions drift.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # ---- gate: committed codegen is still committed ---------------------
      #
      # .gitignore line 3 is upstream's bare `generated`, which git matches at
      # ANY depth and which therefore swallows packages/*/src/generated/ --
      # codegen output that IS committed so a fresh clone typechecks without
      # running tools/gen-api first. The re-include block below it is load
      # bearing and easy to lose in a merge.
      #
      # packages/protocol/src/generated/api.ts is the file that exists today;
      # git check-ignore needs no file on disk, it matches the path against the
      # rules, so the probe creates nothing. Exit 0 from check-ignore means
      # "this path is ignored", which is the failure.
      - name: gitignore does not swallow committed codegen
        run: |
          set -euo pipefail
          tracked="$(git ls-files 'packages/*/src/generated/*')"
          if [ -z "$tracked" ]; then
            echo "::error::no committed codegen under packages/*/src/generated/ -- has .gitignore started swallowing it?"
            exit 1
          fi
          echo "tracked codegen:"
          echo "$tracked" | sed 's/^/  /'
          probe=packages/protocol/src/generated/_ci_probe.ts
          if git check-ignore -q "$probe"; then
            echo "::error::packages/*/src/generated/ is git-ignored again -- see the re-include block in .gitignore"
            git check-ignore -v "$probe"
            exit 1
          fi
          echo "a new file at $probe would be tracked: OK"

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm build

      # The full web suite: both vitest projects (node + jsdom), see
      # vitest.workspace.ts.
      #
      # `pnpm test:ci`, NOT `pnpm test`. `pnpm test` is
      # `vitest run --passWithNoTests` and both projects set
      # `passWithNoTests: true`, so it exits 0 when the include glob matches
      # NOTHING. Measured: breaking only the jsdom project's glob drops 710
      # tests and `pnpm test` still reports success at exit 0. The glob is two
      # path levels deep and this repo was reorganised into that shape
      # recently, so that is a live risk, and it fails in the one direction
      # nobody checks — green.
      #
      # `test:ci` runs the same suite and then asserts a floor on tests and
      # files. See scripts/test-floor.mjs.
      - run: pnpm test:ci

      # ---- gate: parity scoreboard ----------------------------------------
      #
      # `node scripts/parity.mjs` on its own ALWAYS exits 0 -- it only prints.
      # The gate is `--min N`, which fails when fewer than N rows are checked.
      # N is the current baseline (362 done of 365), so a row regressing from
      # [x] to [ ] or [~] is a red build and bumping this number is a conscious
      # decision. Reading docs/feature-parity.md at all is the other half
      # of the gate: a moved or malformed inventory throws here.
      - name: parity scoreboard
        run: |
          set -euo pipefail
          node scripts/parity.mjs
          node scripts/parity.mjs --min 362

      # ---- gate: drain lint -----------------------------------------------
      #
      # tools/parity/drain_lint.py exits 1 on a violation, so it gates as-is.
      # Pure stdlib (ast): it needs the runner's python3 and nothing else -- no
      # venv, no PyMOL -- which is why it runs in this job and not the macOS
      # one. Paths are passed explicitly so this matches what a developer runs.
      - name: drain lint (single-consumer PyMOL reads)
        run: |
          set -euo pipefail
          python3 --version
          python3 tools/parity/drain_lint.py packages/bridge/tenmol_bridge packages/bridge/tests

      # ---- gate: ownership -------------------------------------------------
      #
      # Two halves, because the script has two useful modes and only one of
      # them applies on every branch:
      #
      #  1. Always: the plan must still parse. scripts/ownership.mjs builds its
      #     rules from section 6 of docs/code-ownership.md, and if that
      #     table breaks the script does not error -- it finds no owners and
      #     passes everything. `--list` exits 2 when the work package is not
      #     found, which is exactly the "section 6 stopped parsing" signal.
      #  2. On wp-NN-* branches: the real cross-WP diff check.
      #
      # The WP is passed explicitly rather than inferred. The script's own
      # inference reads `git rev-parse --abbrev-ref HEAD`, which is the literal
      # string "HEAD" on a pull_request checkout, and github.ref_name is
      # "<n>/merge" there -- either would silently disable this gate on every PR.
      - name: ownership lint
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          node scripts/ownership.mjs --list WP-00 > /dev/null
          echo "docs/code-ownership.md section 6 parses"

          num="$(printf '%s' "$BRANCH" | sed -n 's/^[Ww][Pp][-_]\([0-9]\{1,2\}\).*$/\1/p')"
          if [ -z "$num" ]; then
            echo "branch '$BRANCH' is not a wp-NN-* branch: nothing to attribute, skipping the diff check"
            exit 0
          fi
          # 10# forces base 10. Without it bash's printf reads a leading zero
          # as octal, so `wp-08-*` and `wp-09-*` fail with "invalid octal
          # number" and fall through to WP-00 -- the wrong work package.
          wp="$(printf 'WP-%02d' "$((10#$num))")"
          if ! git rev-parse --verify --quiet "origin/$BASE_REF" > /dev/null; then
            git fetch --no-tags --quiet origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          fi
          echo "checking $BRANCH ($wp) against origin/$BASE_REF"
          TENMOL_WP="$wp" node scripts/ownership.mjs --base "origin/$BASE_REF"

      # ---- gate: docs API reference is not stale --------------------------
      #
      # tools/gen-api/emit-docs.mjs regenerates docs/api-reference/ from the
      # committed tools/gen-api/api-schema.json -- node only, no PyMOL -- so a
      # drift between the schema and the committed MDX fails here, exactly like
      # the committed TypeScript client in packages/protocol/src/generated/.
      - name: docs API reference is current
        run: |
          set -euo pipefail
          node tools/gen-api/emit-docs.mjs
          if ! git diff --exit-code -- docs/api-reference; then
            echo "::error::docs/api-reference is stale -- run 'pnpm docs:api' and commit the result"
            exit 1
          fi

      # ---- gate: documentation coverage ratchet ---------------------------
      #
      # scripts/doc-coverage.mjs counts documented vs undocumented PUBLIC
      # symbols across the TypeScript packages (via the TypeScript compiler API)
      # and the Python bridge (scripts/doc_coverage.py, stdlib `ast` on the
      # runner's python3 -- same footing as tools/parity/drain_lint.py).
      # --max-undocumented is a CEILING: a newly added export or def with no doc
      # comment raises the count and fails; the existing backlog below the
      # ceiling never blocks a merge. Lower it as the backlog is paid down.
      - name: documentation coverage
        run: |
          set -euo pipefail
          python3 --version
          node scripts/doc-coverage.mjs --max-undocumented 0

      # ---- gate: Mintlify site links --------------------------------------
      #
      # `mint broken-links` parses docs.json and every page under docs/ and
      # fails on a dead internal link. The two machine-parsed inventories
      # (docs/feature-parity.md, docs/code-ownership.md) are excluded via
      # docs/.mintignore so they are neither rendered nor validated. Pinned so
      # the gate cannot drift under us.
      - name: docs broken links
        run: |
          set -euo pipefail
          cd docs
          npx -y mint@4.2.778 broken-links

  # -------------------------------------------------------------------------
  # The real thing: PyMOL is built from packages/engine/ into
  # packages/bridge/.venv and the bridge's pytest suite runs against it.
  # -------------------------------------------------------------------------
  bootstrap-macos:
    name: bootstrap + bridge (macOS)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # Pinned so the cache key below can name the interpreter exactly.
      # scripts/bootstrap.sh would otherwise pick one itself (Homebrew's
      # python@3.13, then /usr/bin/python3.x, then whatever `python3` is) and
      # whichever it happened to find would silently become part of the cached
      # artefact.
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: resolve build identity
        id: ident
        run: |
          set -euo pipefail
          full="$(python -c 'import sys;print("%d.%d.%d" % sys.version_info[:3])')"
          echo "python=$full" >> "$GITHUB_OUTPUT"
          echo "python-bin=$(command -v python)" >> "$GITHUB_OUTPUT"
          echo "python $full at $(command -v python)"

      # The set scripts/bootstrap.sh requires (it dies listing anything
      # missing). catch2 is deliberately absent: it is only needed by
      # --testing=true, and brew ships v3 while layerCTest wants v2.
      # Build or restore the engine. One definition, shared with
      # webclient-e2e.yml so the two cannot use different cache keys and
      # compile PyMOL twice per PR. See .github/actions/engine-venv.
      - name: engine venv
        id: engine
        uses: ./.github/actions/engine-venv
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache-epoch: ${{ env.CACHE_EPOCH }}

      # Checked here, immediately after bootstrap and before anything else
      # runs, so the blame is unambiguous: nothing but bootstrap has touched
      # the tree yet.
      #
      # bootstrap writes only to git-ignored paths (packages/bridge/.venv,
      # packages/engine/.deps) and removes the egg-info pip drops in the
      # upstream tree. Anything else here is the build polluting
      # packages/engine/, which is upstream and must stay pristine. It also
      # catches `pnpm install` (bootstrap step 7) editing pnpm-lock.yaml.
      - name: repo is still clean after the build
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::bootstrap dirtied the working tree"
            git status --porcelain
            git diff --stat
            exit 1
          fi
          echo "working tree clean"

      # ---- gate: the venv really holds an engine built from THIS tree -------
      #
      # The safety net under the cache. Same probe scripts/doctor.mjs runs,
      # needs no GL, and catches both a broken restore and the one build
      # mistake bootstrap warns about at length: `use-msgpackc=no` still
      # imports fine and still writes a 0-byte .mmtf. The version banner
      # carries the git sha the engine was built at; it is printed, not
      # asserted, because a cache hit from an older commit with identical
      # engine sources is correct and expected.
      - name: engine sanity (import, version, MMTF round-trip)
        run: |
          set -euo pipefail
          packages/bridge/.venv/bin/python - <<'PY'
          import os, tempfile
          import pymol, pymol2
          print(pymol.get_version_message())
          print("pymol:", pymol.__file__)
          with pymol2.PyMOL() as p:
              c = p.cmd
              c.fragment("ala")
              f = os.path.join(tempfile.mkdtemp(), "probe.mmtf")
              c.save(f)
              n = os.path.getsize(f)
              c.delete("all")
              c.load(f)
              atoms = c.count_atoms("all")
              print("mmtf round-trip: %d bytes, %d atoms" % (n, atoms))
              assert n > 0, "0-byte .mmtf: this engine was built without msgpack (MMTF/BCIF are parity rows)"
              assert atoms == 10, "expected 10 atoms back, got %d" % atoms
          PY
          packages/bridge/.venv/bin/python -c 'import tenmol_bridge;print("tenmol_bridge", tenmol_bridge.__version__)'

      # GL context creation needs a window server the runner does not have, so
      # doctor's `offscreen GL` check fails here and takes the script's exit
      # code with it. Report it; do not fail the job on it. Everything else
      # doctor checks is already a hard gate above.
      - name: doctor
        continue-on-error: true
        run: node scripts/doctor.mjs

      # ---- gate: the bridge suite ------------------------------------------
      #
      # The same run as locally
      # (`packages/bridge/.venv/bin/python -m pytest packages/bridge/tests -q`)
      # -- scripts/dev-bridge.sh is that plus the venv on PATH, packages/bridge
      # on PYTHONPATH and PYTHONUNBUFFERED=1, and it is what `pnpm test:bridge`
      # calls.
      #
      # The previous version of this step wrapped the run in `if [ -d ... ]`
      # and echoed "skipping" otherwise, so a mis-pathed workflow was a GREEN
      # build. The directory is now asserted instead. -q keeps the log
      # readable; packages/bridge/pyproject.toml's `-ra -s` still prints a
      # reason for every non-pass (and -s is mandatory -- conftest.py refuses
      # to run with pytest's capture on, because it un-installs pcatch). The
      # junit XML goes to RUNNER_TEMP so it cannot dirty the tree, and is
      # uploaded whether the step passed or failed.
      - name: bridge pytest suite
        run: |
          set -euo pipefail
          test -d packages/bridge/tests || {
            echo "::error::packages/bridge/tests does not exist -- this workflow is mis-pathed"
            exit 1
          }
          # TENMOL_TEST_SLOW scales every wall-clock deadline, rate and budget in
          # the suite (packages/bridge/tests/conftest.py::slow). This suite takes
          # 21m43s here against ~9m on the dev machine, its GL is a software
          # rasteriser and its CPU is shared, so an absolute bound measures the
          # runner. 3x keeps a real regression failing while letting a slow box
          # pass.
          #
          # `-k 'not benchmark'`: three tests assert a frame-time budget
          # (measured 267.67 ms against a 6 ms bound). A performance number from
          # a shared runner with no GPU is noise, not a signal.
          TENMOL_TEST_SLOW=3 \
          bash scripts/dev-bridge.sh --exec python -m pytest packages/bridge/tests -q \
            -k 'not benchmark' \
            --junitxml="$RUNNER_TEMP/pytest-bridge.xml"

      - name: upload bridge pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-bridge-${{ github.run_id }}
          path: ${{ runner.temp }}/pytest-bridge.xml
          if-no-files-found: warn

      # Same caveat as `doctor`: with no window server the pump can come up
      # degraded and never reach state=running. Keep the evidence, do not
      # red-flag the branch.
      - name: acceptance -- bridge answers /healthz
        continue-on-error: true
        run: |
          bash scripts/dev-bridge.sh --port 8765 > "$RUNNER_TEMP/bridge.log" 2>&1 &
          for _ in $(seq 1 60); do
            sleep 1
            if curl -sf --max-time 2 http://127.0.0.1:8765/healthz > "$RUNNER_TEMP/health.json"; then break; fi
          done
          cat "$RUNNER_TEMP/health.json" 2>/dev/null || echo '(no /healthz response in 60 s)'
          echo
          grep -q '"state":[[:space:]]*"running"' "$RUNNER_TEMP/health.json" 2>/dev/null || {
            echo "::error::/healthz did not report state=running"
            exit 1
          }
          echo "healthz OK"

      - name: bridge log
        if: always()
        run: tail -50 "$RUNNER_TEMP/bridge.log" || true
