# Deploy the Mintlify docs on merge to master.
#
# GRACEFUL UNTIL CONNECTED. The site is set up now; the Mintlify account is
# linked later. The deploy step is gated on the MINTLIFY_API_KEY +
# MINTLIFY_PROJECT_ID secrets, and it calls Mintlify's trigger-update API with
# plain `curl` -- no third-party action is referenced, so the job's setup can
# never fail on a missing action. Until the secrets exist this workflow is a
# green no-op. It is deliberately NOT a required check.
#
# The RECOMMENDED hosting path is installing the Mintlify GitHub App, which
# auto-deploys on every push with no secrets and no workflow at all. This
# workflow is the token-based alternative for teams that prefer an explicit,
# in-repo trigger. Pick one; you do not need both.
#
# To use the token path: create the project in Mintlify, generate an admin API
# key, and add two repo secrets -- MINTLIFY_API_KEY and MINTLIFY_PROJECT_ID.
name: docs-deploy

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "tools/gen-api/**"
      - ".github/workflows/docs-deploy.yml"
  workflow_dispatch:

concurrency:
  group: docs-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: deploy to Mintlify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # An undefined secret is the empty string in GitHub Actions, so this is
      # safe before the secrets exist. Both are required for the token path.
      - name: check Mintlify connection
        id: guard
        env:
          MINTLIFY_API_KEY: ${{ secrets.MINTLIFY_API_KEY }}
          MINTLIFY_PROJECT_ID: ${{ secrets.MINTLIFY_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${MINTLIFY_API_KEY:-}" ] || [ -z "${MINTLIFY_PROJECT_ID:-}" ]; then
            echo "connected=false" >> "$GITHUB_OUTPUT"
            echo "Mintlify not connected (need MINTLIFY_API_KEY + MINTLIFY_PROJECT_ID secrets) -- skipping deploy."
            echo "Recommended: install the Mintlify GitHub App, which auto-deploys on push with no secrets."
          else
            echo "connected=true" >> "$GITHUB_OUTPUT"
          fi

      - name: trigger Mintlify deployment
        if: steps.guard.outputs.connected == 'true'
        env:
          MINTLIFY_API_KEY: ${{ secrets.MINTLIFY_API_KEY }}
          MINTLIFY_PROJECT_ID: ${{ secrets.MINTLIFY_PROJECT_ID }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/mintlify-resp.json -w '%{http_code}' -X POST \
            "https://api.mintlify.com/v1/project/update/${MINTLIFY_PROJECT_ID}" \
            -H "Authorization: Bearer ${MINTLIFY_API_KEY}" \
            -H "Content-Type: application/json")
          echo "Mintlify trigger-update: HTTP $code"
          cat /tmp/mintlify-resp.json 2>/dev/null || true
          echo
          if [ "$code" != "202" ]; then
            echo "::error::Mintlify update failed (HTTP $code)"
            exit 1
          fi
